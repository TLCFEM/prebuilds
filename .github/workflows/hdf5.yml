env:
  version: 2.2.0
jobs:
  hdf5-linux:
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - name: Compile
        run: |
          git clone --branch ${{ env.version }} --depth 1 https://github.com/HDFGroup/hdf5.git
          mkdir packing && mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=../packing ../hdf5
          cmake --build . --target install --config Release --parallel
          cd ../packing && tar cvzf ../HDF5-${{ env.version }}-${{ matrix.os }}.tar.gz ./*
      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          asset_name: HDF5-${{ env.version }}-${{ matrix.os }}.tar.gz
          file: HDF5-${{ env.version }}-${{ matrix.os }}.tar.gz
          overwrite: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
  hdf5-macos:
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - name: Compile
        run: |
          export CC=gcc-13 && export CXX=g++-13 && export FC=gfortran-13
          git clone --branch ${{ env.version }} --depth 1 https://github.com/HDFGroup/hdf5.git
          mkdir packing && mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=../packing ../hdf5
          cmake --build . --target install --config Release --parallel
          cd ../packing && tar cvzf ../HDF5-${{ env.version }}-${{ matrix.os }}.tar.gz ./*
      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          asset_name: HDF5-${{ env.version }}-${{ matrix.os }}.tar.gz
          file: HDF5-${{ env.version }}-${{ matrix.os }}.tar.gz
          overwrite: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
    strategy:
      matrix:
        os:
          - macos-15-large
          - macos-26-large
          - macos-15-xlarge
          - macos-26-xlarge
  hdf5-win:
    runs-on: windows-2025
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - name: Compile
        run: |
          git clone --branch ${{ env.version }} --depth 1 https://github.com/HDFGroup/hdf5.git
          mkdir packing && mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="D:\a\prebuilds\prebuilds\packing" ../hdf5
          cmake --build . --target install --config Release --parallel
          cd ../packing && 7z a ../HDF5-${{ env.version }}-win.zip ./*
      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          asset_name: HDF5-${{ env.version }}-win.zip
          file: HDF5-${{ env.version }}-win.zip
          overwrite: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
  hdf5-win-gcc:
    runs-on: windows-2025
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - name: Compile
        run: |
          C:/msys64/usr/bin/wget.exe -q https://github.com/brechtsanders/winlibs_mingw/releases/download/15.3.0posix-14.0.0-ucrt-r1/winlibs-x86_64-posix-seh-gcc-15.3.0-mingw-w64ucrt-14.0.0-r1.7z
          7z x winlibs-x86_64-posix-seh-gcc-15.3.0-mingw-w64ucrt-14.0.0-r1.7z
          git clone --branch ${{ env.version }} --depth 1 https://github.com/HDFGroup/hdf5.git
          mkdir packing && mkdir build && cd build
          cmake -G "MinGW Makefiles" -DCMAKE_C_COMPILER=D:/a/prebuilds/prebuilds/mingw64/bin/gcc.exe -DCMAKE_CXX_COMPILER=D:/a/prebuilds/prebuilds/mingw64/bin/g++.exe -DCMAKE_Fortran_COMPILER=D:/a/prebuilds/prebuilds/mingw64/bin/gfortran.exe -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="D:\a\prebuilds\prebuilds\packing" ../hdf5
          cmake --build . --target install --config Release
          cd ../packing && 7z a ../HDF5-${{ env.version }}-win-gcc.zip ./*
      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          asset_name: HDF5-${{ env.version }}-win-gcc.zip
          file: HDF5-${{ env.version }}-win-gcc.zip
          overwrite: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
name: hdf5
'on': workflow_dispatch
