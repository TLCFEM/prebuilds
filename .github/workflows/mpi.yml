env:
  ARCHIVE: ''
jobs:
  mpich:
    runs-on: ${{ matrix.os }}
    steps:
      - name: Compile
        run: |
          export ARCHIVE=MPICH-${{ matrix.os }}.tar.gz
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          wget -q https://www.mpich.org/static/downloads/${{ matrix.version }}/mpich-${{ matrix.version }}.tar.gz
          tar xf mpich-${{ matrix.version }}.tar.gz
          cd mpich-${{ matrix.version }} && ./configure --prefix=/MPICH
          make -j$(nproc) && sudo make install
          tar cvzf ../$ARCHIVE /MPICH
      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          asset_name: ${{ env.ARCHIVE }}
          file: ${{ env.ARCHIVE }}
          overwrite: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
        version:
          - 5.0.1
  openmpi:
    runs-on: ${{ matrix.os }}
    steps:
      - name: Compile
        run: |
          export ARCHIVE=OpenMPI-${{ matrix.os }}.tar.gz
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          wget -q https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-${{ matrix.version }}.tar.bz2
          tar xf openmpi-${{ matrix.version }}.tar.bz2
          cd openmpi-${{ matrix.version }} && ./configure --prefix=/OpenMPI
          make -j$(nproc) && sudo make install
          tar cvzf ../$ARCHIVE /OpenMPI
      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          asset_name: ${{ env.ARCHIVE }}
          file: ${{ env.ARCHIVE }}
          overwrite: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
        version:
          - 5.0.10
name: mpi
'on': workflow_dispatch
